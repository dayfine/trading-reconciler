[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-reconciler"
version = "0.0.1"
description = "External P&L reconciliation tool for trading-1 backtest runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
reconciler = "reconciler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reconciler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
